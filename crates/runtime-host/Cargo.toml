[package]
name = "runtime-host"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = "50"
wasmtime-wasi = "50"
wasmtime-wasi-http = "50"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"]}
