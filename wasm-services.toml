
[deployment]
architecture = "monolithic"

[runtime]
max_instances = 100

[gateway]
host = "127.0.0.1"
port = 8080
enabled = true

[workloads.sample]
kind = "monolith"
repository = "../sample-wasi-http-rust"
artifact = "target/wasm32-wasip2/release/sample_wasi_http_rust.wasm"
enabled = true
instances = 5

[workloads.sample.build]
driver = "cargo"
manifest = "Cargo.toml"
target = "wasm32-wasip2"
profile = "release"

[workloads.sample.resources]
memory_limit = 268435456

